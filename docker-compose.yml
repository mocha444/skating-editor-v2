services:
  app:
    build:
      context: .
    ports:
    - 0.0.0.0:3002:3000
    environment:
    - NODE_ENV=production
    - DATA_DIR=/app/data
    volumes:
    - media_data:/app/data
    restart: unless-stopped
  worker:
    build: .
    command:
    - node
    - scripts/worker.js
    environment:
    - NODE_ENV=production
    - DATA_DIR=/app/data
    volumes:
    - media_data:/app/data
    - .:/app
    ipc: host
    devices:
    - /dev/dri/card0:/dev/dri/card0
    group_add:
    - video
    - render
    restart: unless-stopped
    deploy:
      replicas: 1
volumes:
  media_data: null
